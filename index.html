<!DOCTYPE html>
<html>
<head>
  <style>
body{
font-family: Arial, sans-serif;
max-width:800px;
margin:auto;
padding:20px;
}
 
h1{
color:#0b5cab;
}
 
select{
width:200px;
padding:5px;
margin-bottom:15px;
}
 
button{
background:#0b5cab;
color:white;
border:none;
padding:10px 20px;
cursor:pointer;
margin-left:250px;
}
</style>
<title>SteelForce Market Championship</title>
</head>
<body>
<h1>🏆 STEELFORCE MARKET CHAMPIONSHIP</h1>

  <button onclick="showPredictions()">Prévisions</button>
 
<button onclick="showHistory()">
Historique
</button>
  <div id="predictionSection">
 
<p>Trader</p>
 
<select id="trader">
<option>Basile</option>
<option>Olivier</option>
<option>Jean</option>
<option>David</option>
<option>Jennifer</option>
<option>Burcu</option>
<option>Diego</option>
<option>Patrick</option>
</select>
 
<h3>HRC China FOB</h3>
<select id="hrc">
<option>UP</option>
<option>FLAT</option>
<option>DOWN</option>
</select>
 
<h3>CRC CNY</h3>
<select id="crc">
<option>UP</option>
<option>FLAT</option>
<option>DOWN</option>
</select>
 
<h3>WRIC China FOB</h3>
<select id="wric">
<option>UP</option>
<option>FLAT</option>
<option>DOWN</option>
</select>

  <h3>Billets China FOB</h3>
<select id="billets">
<option>UP</option>
<option>FLAT</option>
<option>DOWN</option>
</select>
 
<h3>Rebars TK</h3>
<select id="rebars">
<option>UP</option>
<option>FLAT</option>
<option>DOWN</option>
</select>
 
<h3>Scrap TK CFR</h3>
<select id="scrap">
<option>UP</option>
<option>FLAT</option>
<option>DOWN</option>
</select>
  
<br><br>
 
<button style="margin-left:250px;" onclick="
document.getElementById('predictionsTable').innerHTML +=
'<tr>' +

'<td>' + new Date().toLocaleDateString() + '</td>' +
'<td>' + document.getElementById('trader').value + '</td>' +
'<td>' + document.getElementById('hrc').value + '</td>' +
'<td>' + document.getElementById('crc').value + '</td>' +
'<td>' + document.getElementById('wric').value + '</td>' +
'<td>' + document.getElementById('billets').value + '</td>' +
'<td>' + document.getElementById('rebars').value + '</td>' +
'<td>' + document.getElementById('scrap').value + '</td>' +
'</tr>';
    localStorage.setItem(
'predictionsTable',
document.getElementById('predictionsTable').innerHTML
);
'<h2>Prévisions enregistrées</h2>' +
'<p><b>Trader :</b> ' + document.getElementById('trader').value + '</p>' +
'<p><b>HRC :</b> ' + document.getElementById('hrc').value + '</p>' +
'<p><b>CRC :</b> ' + document.getElementById('crc').value + '</p>' +
'<p><b>WRIC :</b> ' + document.getElementById('wric').value + '</p>' +
'<p><b>Billets :</b> ' + document.getElementById('billets').value + '</p>' +
'<p><b>Rebars :</b> ' + document.getElementById('rebars').value + '</p>' +
'<p><b>Scrap :</b> ' + document.getElementById('scrap').value + '</p>';
">
VALIDER
</button>
 
<div id="result"></div>
</div>
 
<div id="historySection" style="display:none;">
 
<hr>
 
<h2>Historique des prévisions</h2>
  
<table border="1" cellpadding="5">
<thead>
<tr>
<th>Date</th>
<th>Trader</th>
<th>HRC</th>
<th>CRC</th>
<th>WRIC</th>
<th>Billets</th>
<th>Rebars</th>
<th>Scrap</th>
</tr>
</thead>
 
<tbody id="predictionsTable">
 
</tbody>
</table>
</div>
  
<script>
 
document.getElementById('predictionsTable').innerHTML =
localStorage.getItem('predictionsTable') || '';
 
function showPredictions(){
document.getElementById('predictionSection').style.display = 'block';
document.getElementById('historySection').style.display = 'none';
}
 
function showHistory(){
document.getElementById('predictionSection').style.display = 'none';
document.getElementById('historySection').style.display = 'block';
}

<button onclick="showLeaderboard()">
Leaderboard
</button>
 
</script>
